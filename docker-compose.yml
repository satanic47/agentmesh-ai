version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: agentmesh-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  agentmesh-api:
    build: .
    container_name: agentmesh-api
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH_NAME=agentmesh_graph
      - AUTO_FALLBACK_LOCAL=false
      - PORT=8000
      - HOST=0.0.0.0
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  falkordb_data:
